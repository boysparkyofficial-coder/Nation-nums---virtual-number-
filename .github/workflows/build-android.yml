name: Build Nation Nums Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Download admin-managed logo, with safe build fallback
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          if curl --fail --location --retry 2 --retry-delay 2 \
            "https://base44.app/api/apps/6ac1b21923bd8a65822f7956/files/mp/public/6ac1b21923bd8a65822f7956/c45af28c6_1005314965.png" \
            --output /tmp/nation-nums-admin-logo.png; then
            python3 -m pip install --quiet Pillow
            python3 - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/nation-nums-admin-logo.png').convert('RGBA')
          src.thumbnail((448, 448), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (512, 512), (255, 255, 255, 0))
          canvas.alpha_composite(src, ((512 - src.width) // 2, (512 - src.height) // 2))
          canvas.save('app/src/main/res/drawable-nodpi/ic_launcher_logo.png', optimize=True)
          print('Prepared admin-managed Nation Nums launcher logo.')
          PY
          else
            echo "Admin logo URL was unavailable; keeping existing launcher artwork for this build."
            cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/drawable/ic_launcher_logo.xml
          fi

      - name: Run local unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Build debug Android App Bundle
        run: gradle bundleDebug

      - name: Export debug signing certificate fingerprint for Android App Links
        run: |
          set -euo pipefail
          mkdir -p app/build/verification
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" /usr/local/lib/android/sdk /opt/android-sdk -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "Could not locate Android apksigner in the runner SDK."
            exit 1
          fi
          echo "Using APK signer: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/verification/debug-certificate.txt 2>&1
          python3 - <<'PY'
          import re
          from pathlib import Path
          certificate_output = Path("app/build/verification/debug-certificate.txt").read_text()
          match = re.search(r"(?i)certificate SHA-256 digest:\s*([0-9a-f:]{64,95})", certificate_output)
          if not match:
              print(certificate_output)
              raise SystemExit("Could not parse the APK signing certificate SHA-256 fingerprint.")
          fingerprint = re.sub(r"[^0-9a-f]", "", match.group(1)).upper()
          if len(fingerprint) != 64:
              raise SystemExit(f"Expected 64 SHA-256 hex characters, got {len(fingerprint)}.")
          formatted = ":".join(fingerprint[i:i+2] for i in range(0, 64, 2))
          Path("app/build/verification/debug-sha256.txt").write_text(formatted + "\n")
          print("Debug signing certificate SHA-256:", formatted)
          PY

      - name: Upload debug App Links fingerprint
        uses: actions/upload-artifact@v6
        with:
          name: nation-nums-app-links-fingerprint
          path: app/build/verification/debug-sha256.txt
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: nation-nums-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: nation-nums-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
